<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>滬連氣候報告</title>
  <meta name="description" content="上海與大連的氣候平年值、季節特徵與即時天氣報告。">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <p class="eyebrow">氣候報告</p>
      <h1>上海・大連氣候報告</h1>
      <p class="lede">兩座濱海城市的月均溫、降水量、季節特徵與即時天氣。</p>
      <nav class="tabs" role="tablist" aria-label="選擇城市">
        <button type="button" role="tab" id="tab-shanghai" data-view="shanghai" aria-selected="true">上海</button>
        <button type="button" role="tab" id="tab-dalian" data-view="dalian" aria-selected="false">大連</button>
        <button type="button" role="tab" id="tab-compare" data-view="compare" aria-selected="false">雙城對照</button>
      </nav>
    </div>
  </header>

  <main class="wrap" id="main" role="tabpanel" aria-live="polite"></main>

  <footer class="wrap site-footer">
    <p>氣候平年值為約 1991–2020 年的參考近似值，整理自中國氣象局公開統計。
      即時天氣與預報來自 <a href="https://open-meteo.com/" rel="noopener" target="_blank">Open-Meteo</a>，時間以當地時間（UTC+8）顯示。</p>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
